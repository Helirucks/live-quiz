<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Live-Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <canvas id="matrix-bg"></canvas>

  <div class="page">
    <div class="card card--narrow">
      <div class="terminal-bar">
        <span class="terminal-dot dot-red"></span>
        <span class="terminal-dot dot-yellow"></span>
        <span class="terminal-dot dot-green"></span>
        <span class="terminal-title">live_quiz.py</span>
      </div>
      <div class="card-body" style="text-align:center;">
        <div class="landing-icon">🖍️</div>
        <h1>Live-Quiz</h1>
        <p>Wähle aus, ob du das Quiz steuerst oder als Spieler teilnimmst.</p>

        <div class="btn-row">
          <a class="btn btn-primary" href="/host">Ich bin der Quizmaster</a>
          <a class="btn btn-secondary" href="/play">Ich nehme teil</a>
        </div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/matrix-bg.js') }}"></script>
</body>
</html>
